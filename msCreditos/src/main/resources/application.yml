spring:
  application:
    name: msCreditos
  datasource:
    url: jdbc:mysql://localhost:3306/creditos_db
    username: root
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

server:
  port: 8086

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true